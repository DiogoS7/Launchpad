name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  metadata-checks:
    name: Metadata checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check metadata, field documentation, seed data and README images
        run: python scripts/ci/check_metadata.py

  validate-deploy:
    name: Validate against Salesforce
    runs-on: ubuntu-latest
    needs: metadata-checks
    # Secrets are not available to pull requests from forks, so only run on this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip if the org secret is not configured
        if: env.SFDX_AUTH_URL == ''
        run: echo "::notice::SFDX_AUTH_URL secret not set, skipping the Salesforce validation."
      - uses: actions/setup-node@v5
        if: env.SFDX_AUTH_URL != ''
        with:
          node-version: "22"
      - name: Install Salesforce CLI
        if: env.SFDX_AUTH_URL != ''
        run: npm install --global @salesforce/cli
      - name: Authenticate to the org
        if: env.SFDX_AUTH_URL != ''
        run: |
          # Strip spaces and line breaks that sneak in when the secret is pasted.
          printf '%s' "$SFDX_AUTH_URL" | tr -d '[:space:]' > ./authurl.txt
          if ! grep -q '^force://' ./authurl.txt; then
            echo "::error::SFDX_AUTH_URL must start with force:// (copy only the value of 'Sfdx Auth Url' from: sf org display --verbose)"
            rm ./authurl.txt
            exit 1
          fi
          sf org login sfdx-url --sfdx-url-file ./authurl.txt --alias ci-org --set-default
          rm ./authurl.txt
      - name: Check-only deploy (nothing is changed in the org)
        if: env.SFDX_AUTH_URL != ''
        run: sf project deploy validate --source-dir force-app --target-org ci-org --test-level RunLocalTests --wait 30