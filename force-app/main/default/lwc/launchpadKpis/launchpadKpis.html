<template>
    <article class="cc">
        <header class="cc-header">
            <h2 class="cc-title">Command Centre</h2>
            <span class="cc-subtitle">Live onboarding status</span>
        </header>
        <template lwc:if={loaded}>
            <div class="cc-tiles">
                <template for:each={tiles} for:item="tile">
                    <div key={tile.key} class={tile.cls}>
                        <div class="tile-value">{tile.value}</div>
                        <div class="tile-label">{tile.label}</div>
                        <div class="tile-note">{tile.note}</div>
                    </div>
                </template>
            </div>
            <section class="cc-soon">
                <h3 class="cc-section-title">Launching in the next 14 days</h3>
                <template lwc:if={hasLaunchingSoon}>
                    <template for:each={launchingSoon} for:item="plan">
                        <button key={plan.id} class={plan.cls} data-id={plan.id} onclick={openPlan}>
                            <span class="soon-countdown">{plan.countdown}</span>
                            <span class="soon-text">
                                <span class="soon-title">{plan.title}</span>
                                <span class="soon-meta">{plan.status}<template lwc:if={plan.warning}> · <span class="soon-warning">{plan.warning}</span></template></span>
                            </span>
                        </button>
                    </template>
                </template>
                <template lwc:else>
                    <p class="cc-empty">No launches scheduled in the next two weeks.</p>
                </template>
            </section>
        </template>
        <template lwc:elseif={errors}>
            <p class="cc-empty">The command centre could not load its data.</p>
        </template>
    </article>
</template>
